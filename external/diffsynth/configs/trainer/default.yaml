# PyTorch-Lightning Trainer, ported from PL 1.4/1.5 to PL 2.x.
#
# Downgrading to PL 1.x instead was the obvious move and is the wrong one: PL
# 1.4/1.5 pairs with torch ~1.8-1.11, whose wheels are compiled for older CUDA
# compute capabilities and will not run on a current card ("no kernel image is
# available for execution on the device"). Porting forward is ~30 lines and
# keeps modern torch on the GPU we actually have.
#
# Removed keys, all of which were PL 1.x-only and none of which affect the
# experiment: checkpoint_callback (-> enable_checkpointing), weights_summary
# (-> ModelSummary callback), progress_bar_refresh_rate, process_position,
# flush_logs_every_n_steps, log_gpu_memory, prepare_data_per_node,
# move_metrics_to_cpu, terminate_on_nan (-> detect_anomaly),
# truncated_bptt_steps, reload_dataloaders_every_epoch (-> _n_epochs),
# amp_backend, amp_level, gpus/tpu_cores (-> accelerator + devices),
# auto_lr_find / auto_scale_batch_size / auto_select_gpus (-> Tuner).
#
# resume_from_checkpoint is gone too: in PL 2 the checkpoint path is passed to
# fit(). It is kept here as a plain field and train.py forwards it, so the
# README's resume commands still work unchanged.
_target_: pytorch_lightning.Trainer

max_epochs: 200
gradient_clip_val: 1.0

# accelerator: "auto" picks GPU when one is visible and CPU otherwise, which is
# what makes the smoke test runnable with no card free.
accelerator: "auto"
devices: 1
num_nodes: 1

enable_checkpointing: True
benchmark: False

# Bitwise reproducibility across runs of the same configuration. TRIED AND NOT
# AVAILABLE -- left False deliberately, with the reason, so nobody spends the
# afternoon again.
#
# Setting this True raises:
#   upsample_linear1d_backward_out_cuda does not have a deterministic
#   implementation
#
# from util.resample_frames, which is the one interpolation the whole synth
# depends on -- oscillators, filter, envelopes, and param_loss itself all call
# it. So it cannot be routed around, only rewritten, and a rewrite would change
# the synth's numerics against the paper we are reproducing.
#
# "warn" would let it run, but the op stays nondeterministic, so it buys nothing
# over leaving this False.
#
# What we do instead: measure the run-to-run spread and quote it. Before epoch
# 50 every pretrain and ploss compute the same loss, so their divergence there
# is exactly that noise -- ~1% in Param and ~0.2 in val_id/lsd, against effects
# of ~36% and ~1.8 in the paper's own table. See monitor_diffsynth --spread.
#
# This is arguably the better answer anyway: bitwise determinism hides seed
# sensitivity rather than measuring it, and "is this difference bigger than
# noise" is the question a reviewer actually asks.
deterministic: False
precision: 32

overfit_batches: 0.0
limit_train_batches: 1.0
limit_val_batches: 1.0
limit_test_batches: 1.0
val_check_interval: 1.0
check_val_every_n_epoch: 1
num_sanity_val_steps: 2
log_every_n_steps: 50
accumulate_grad_batches: 1
min_epochs: 1
max_steps: -1
min_steps: null
fast_dev_run: False
detect_anomaly: False
profiler: null
default_root_dir: null

# Not a Trainer argument in PL 2 -- train.py pops it and passes it to fit().
resume_from_checkpoint: null

# Not a Trainer argument either; train.py pops it and builds a ModelCheckpoint.
# 0 disables it, which is the published behaviour: upstream keeps only the best
# by val_ood/lsd, plus the latest.ckpt this repo added. Neither lets two arms be
# compared at the same epoch, and every question this experiment has reached has
# turned out to need that. Set it to N to also keep an unconditional checkpoint
# every N epochs.
checkpoint_every_n_epochs: 0
