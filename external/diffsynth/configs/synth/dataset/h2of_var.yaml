name: harmor_2oscfree_var
# h2of.yaml with the note placed in a WINDOW of the clip instead of filling it.
#
# THE ONE IDEA. Take the note the published generator makes, and put it between
# t0 and t1 instead of between 0 and 4 s. Inside that window it is exactly the
# published envelope on a compressed time axis -- same attack, decay, sustain
# and release draws, same shape, same noise -- and outside it the clip is
# silent. At t0=0, t1=4 s the two generators are bit-identical. So this is the
# published task plus one thing: where the note sits in time and how long it
# lasts. Nothing about the sound itself is redistributed.
#
# WHY IT IS NEEDED. Nothing in h2of.yaml can vary duration. The envelope always
# begins rising at t=0, NOTE_OFF is pinned at 0.75 so the release fires at 3.0 s
# in all 20000 clips, and the noise term is added outside the A+D+S sum so a
# finished note never reaches silence. Measured on 400 generated clips, the
# fraction of the 4 s window within 60 dB of peak spans 0.958 to 0.998: every
# clip sounds from 0.000 s to 4.000 s. The material this has to transfer to --
# classic synth bass one-shots, of which the Juno-6 packs are the first -- is
# nothing like that: a sampler trims near the transient rather than on it, so
# the file opens with a lead-in, and the note ends when it ends. Measured on the
# Juno saw-bass pack, occupancy is 0.21.
#
# WHAT REPLACED WHAT. An earlier version of this config approximated the same
# effect with five separate knobs -- a delay parameter, multiplicative envelope
# noise, SU_A pinned to 0, a floor on attack+decay, and a power bias on those
# draws. Each was defensible and together they were a different envelope
# distribution, which would have made "same task, different loss" hard to
# defend. The time warp does all of it with one, and preserves the published
# shape distribution exactly.
#
# THE MODEL IS UNTOUCHED, and can be: save_params below is byte-identical to
# h2of.yaml's, the model synth configs/synth/h2of.yaml has no envelopes at all,
# and START and LENGTH appear in no save_params list. The same three arms train
# on this data with no edit -- they do need retraining, since the existing
# checkpoints learned the old distribution.
#
# WHAT TIME-SCALING ASSUMES, so it is not discovered later. Warping the whole
# envelope means a shorter note has a proportionally shorter attack AND decay.
# Across a LIBRARY OF PATCHES that is roughly right and the measurements point
# that way -- Juno pulse bass 80 ms attack in a ~1.3 s note, open pad 1152 ms in
# a note that fills 4 s. Within ONE patch played at different lengths it is
# wrong: there the attack is a property of the patch and only the decay
# shortens. ds_source_diag's atk_ms and t20_ms columns measure the generated set
# against the packs directly, which is how that gets checked rather than
# assumed.

n_oscs: 2
max_value: 0.6

dag:
  enva:
    config:
      _target_: diffsynth.modules.envelope.ADSREnvelope
      max_value: 0.6
      channels: 2
      # 0.5 s to 4.0 s at a 4 s clip. The upper end is 1.0 deliberately: a note
      # that fills the window is the published case and has to stay reachable,
      # or the new set would not contain the old one.
      length_range: [0.125, 1.0]
    connections:
      floor: AMP_FLOOR
      peak: PEAK_A
      attack: AT_A
      decay: DE_A
      sus_level: SU_A
      release: RE_A
      note_off: NOTE_OFF
      noise_mag: NOISE_A
      start: START
      length: LENGTH
  envc:
    config:
      _target_: diffsynth.modules.envelope.ADSREnvelope
      channels: 1
      length_range: [0.125, 1.0]
    connections:
      floor: CUT_FLOOR
      peak: PEAK_C
      attack: AT_C
      decay: DE_C
      sus_level: SU_C
      release: RE_C
      note_off: NOTE_OFF
      noise_mag: NOISE_C
      # THE SAME START AND LENGTH as the amplitude envelope, so the filter
      # sweep is warped by the same factor and the note's timbral movement
      # stays in step with its level. Two independent windows would put a
      # filter sweep outside the note.
      start: START
      length: LENGTH
  harmor:
    config:
      _target_: diffsynth.modules.harmor.Harmor
      sample_rate: 16000
      sep_amp: true
      n_oscs: 2
    connections:
      amplitudes: enva
      osc_mix: M_OSC
      f0_hz: BFRQ
      f0_mult: MULT
      cutoff: envc
      q: Q_FILT

# UNCHANGED FROM h2of.yaml. NOTE_OFF stays pinned at 0.75 and now means 75% of
# the NOTE rather than 75% of the clip, which is exactly what "identical inside
# the window" requires. SU_A stays drawn.
fixed_params:
  NOTE_OFF: 0.75
  AMP_FLOOR: 0
static_params: [BFRQ, M_OSC, MULT, Q_FILT, NOISE_C, NOISE_A, AT_A, DE_A, SU_A, RE_A, AMP_FLOOR, PEAK_A, AT_C, DE_C, SU_C, RE_C, CUT_FLOOR, PEAK_C, START, LENGTH]

# IDENTICAL to h2of.yaml's, and it has to be: these are dag_summary keys read in
# BOTH this generator's dag (giving the rendered curve) and the model synth
# h2of.yaml's dag (giving the slot it feeds), which is what lets one list serve
# both sides.
save_params: [harmor_amplitudes, harmor_osc_mix, harmor_f0_hz, harmor_f0_mult, harmor_cutoff, harmor_q]
